name: TrucBlog daily YouTube Music Trending

on:
  schedule:
    - cron: "20 0 * * *"  # 08:20 Perth / 07:20 Vietnam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public chart snapshot
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_trending.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trending.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily YouTube Music chart update"
            git push
          fi
